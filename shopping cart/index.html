<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro Luxe - Menu & Cart</title>
    <style>
        :root {
            --primary-color: #d97706;
            --primary-dark: #b45309;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --white: #ffffff;
            --gray-light: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header / Navbar */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .cart-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s;
        }

        .cart-btn:hover {
            background-color: var(--primary-dark);
        }

        .cart-count {
            background-color: var(--white);
            color: var(--primary-color);
            border-radius: 50%;
            padding: 0.1rem 0.5rem;
            font-size: 0.85rem;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            color: var(--text-color);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .menu-item {
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .menu-item:hover {
            transform: translateY(-5px);
        }

        .menu-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .item-details {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .item-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .item-price {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .item-desc {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .add-to-cart-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }

        .add-to-cart-btn:hover {
            background-color: var(--primary-color);
            color: var(--white);
        }

        /* Cart Sidebar Drawer */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: var(--white);
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: right 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            background-color: var(--gray-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-light);
        }

        .cart-item-info h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .cart-item-info p {
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-item-actions button {
            background-color: var(--gray-light);
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-footer {
            padding: 1.5rem;
            background-color: var(--gray-light);
            border-top: 1px solid var(--gray-light);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background-color: var(--primary-dark);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🍴 Bistro Luxe</div>
        <button class="cart-btn" id="cartToggle">
            Cart <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <div class="container">
        <h1>Our Signature Menu</h1>
        
        <div class="menu-grid" id="menuGrid">
            </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Order</h3>
            <button class="close-cart" id="closeCart">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p style="text-align: center; color: #64748b;">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="alert('Proceeding to checkout!')">Checkout</button>
        </div>
    </div>

    <script>
        // Sample Menu Data
        const menuItems = [
            { id: 1, name: "Truffle Burger", price: 18.99, description: "Juicy beef patty infused with truffle oil, aged cheddar, and wild mushrooms.", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "Margherita Pizza", price: 15.50, description: "Classic wood-fired pizza with San Marzano tomatoes, fresh mozzarella, and basil.", image: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "Caesar Salad", price: 12.00, description: "Crisp romaine hearts, garlic croutons, shaved parmesan, and creamy Caesar dressing.", image: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "Grilled Salmon", price: 24.00, description: "Fresh Atlantic salmon fillet served with asparagus and lemon-butter sauce.", image: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        // DOM Elements
        const menuGrid = document.getElementById('menuGrid');
        const cartToggle = document.getElementById('cartToggle');
        const closeCart = document.getElementById('closeCart');
        const cartSidebar = document.getElementById('cartSidebar');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartTotal = document.getElementById('cartTotal');

        // Render Menu Items
        function renderMenu() {
            menuGrid.innerHTML = menuItems.map(item => `
                <div class="menu-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="item-details">
                        <div class="item-header">
                            <span class="item-title">${item.name}</span>
                            <span class="item-price">$${item.price.toFixed(2)}</span>
                        </div>
                        <p class="item-desc">${item.description}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${item.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        // Add item to cart
        function addToCart(id) {
            const product = menuItems.find(item => item.id === id);
            const cartItem = cart.find(item => item.id === id);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        // Change quantity function
        function changeQuantity(id, change) {
            const cartItem = cart.find(item => item.id === id);
            if (cartItem) {
                cartItem.quantity += change;
                if (cartItem.quantity <= 0) {
                    cart = cart.filter(item => item.id !== id);
                }
            }
            updateCart();
        }

        // Update Cart UI
        function updateCart() {
            // Count total items
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalCount;

            // Render Cart Drawer Content
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="text-align: center; color: #64748b;">Your cart is empty.</p>`;
                cartTotal.textContent = "$0.00";
                return;
            }

            let totalPrice = 0;
            cartItemsContainer.innerHTML = cart.map(item => {
                totalPrice += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>$${(item.price * item.quantity).toFixed(2)}</p>
                        </div>
                        <div class="cart-item-actions">
                            <button onclick="changeQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            cartTotal.textContent = `$${totalPrice.toFixed(2)}`;
        }

        // Toggle Drawer Visibility
        function toggleCartDrawer() {
            cartSidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        cartToggle.addEventListener('click', toggleCartDrawer);
        closeCart.addEventListener('click', toggleCartDrawer);
        overlay.addEventListener('click', toggleCartDrawer);

        // Initial Load
        renderMenu();
    </script>
</body>
</html>
